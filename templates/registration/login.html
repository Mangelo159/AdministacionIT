{% extends 'base.html' %}
{% load static %}
{% block title %}Iniciar Sesión — Inventario{% endblock %}

{% block content %}
<div class="flex justify-center items-start pt-4">
  <div class="w-full max-w-sm">

    <div class="bg-white rounded-2xl shadow-md border border-slate-200 overflow-hidden">

      <!-- Header sky blue -->
      <div class="bg-[#C8D9E6] px-8 py-7 text-center border-b border-[#b0cad9]">
        <div class="w-14 h-14 bg-[#2F4156] rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-md overflow-hidden">
          <img src="{% static 'logo.png' %}" alt="Logo"
               class="w-full h-full object-contain"
               onerror="this.style.display='none'; this.nextElementSibling.style.display='block'">
          <i class="bi bi-pc-display text-[#C8D9E6] text-2xl" style="display:none"></i>
        </div>
        <h1 class="text-lg font-bold text-[#2F4156]">Sistema de Administración</h1>
        <p class="text-[#2F4156]/55 text-xs mt-1">Departamento de TIC</p>
      </div>

      <!-- Formulario -->
      <div class="px-8 py-7">
        <p class="text-sm font-medium text-slate-600 text-center mb-5">Ingresa tus credenciales</p>

        {% if form.errors %}
        <div class="flex items-center gap-2 px-3 py-2.5 mb-4 rounded-xl bg-red-50 border border-red-200 text-red-700 text-sm">
          <i class="bi bi-exclamation-circle-fill text-red-400 shrink-0"></i>
          <span>Usuario o contraseña incorrectos.</span>
        </div>
        {% endif %}

        <form method="post">
          {% csrf_token %}

          <div class="mb-4">
            <label for="id_username" class="block text-xs font-semibold text-[#2F4156]/70 uppercase tracking-wide mb-1.5">
              Usuario
            </label>
            <div class="flex border border-slate-200 rounded-lg overflow-hidden focus-within:ring-2 focus-within:ring-[#2F4156] focus-within:border-transparent transition-all">
              <span class="inline-flex items-center px-3 bg-[#C8D9E6]/30 border-r border-slate-200 text-[#2F4156]/60">
                <i class="bi bi-person text-sm"></i>
              </span>
              <input type="text" name="username" id="id_username"
                     placeholder="Nombre de usuario" autofocus required
                     class="flex-1 px-3 py-2.5 text-sm text-slate-700 bg-white outline-none placeholder:text-slate-400">
            </div>
          </div>

          <div class="mb-6">
            <label for="id_password" class="block text-xs font-semibold text-[#2F4156]/70 uppercase tracking-wide mb-1.5">
              Contraseña
            </label>
            <div class="flex border border-slate-200 rounded-lg overflow-hidden focus-within:ring-2 focus-within:ring-[#2F4156] focus-within:border-transparent transition-all">
              <span class="inline-flex items-center px-3 bg-[#C8D9E6]/30 border-r border-slate-200 text-[#2F4156]/60">
                <i class="bi bi-lock text-sm"></i>
              </span>
              <input type="password" name="password" id="id_password"
                     placeholder="Contraseña" required
                     class="flex-1 px-3 py-2.5 text-sm text-slate-700 bg-white outline-none placeholder:text-slate-400">
            </div>
          </div>

          <button type="submit"
                  class="w-full inline-flex items-center justify-center gap-2 px-4 py-2.5
                         bg-[#2F4156] text-white text-sm font-semibold rounded-lg
                         hover:bg-[#3a5068] transition-colors shadow-md">
            <i class="bi bi-box-arrow-in-right"></i>
            Ingresar
          </button>
        </form>
      </div>
    </div>

  </div>
</div>
{% endblock %}
